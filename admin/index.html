<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | Gir Govalan Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header"><div><p class="eyebrow">Gir Govalan</p><h1>Orders</h1></div><button id="logout" class="secondary">Sign out</button></header>
    <section id="login" class="panel login-panel"><h2>Admin access</h2><p>Enter the admin token configured in Vercel.</p><form id="login-form"><input id="token" type="password" autocomplete="current-password" required placeholder="Admin token"><button>Open dashboard</button></form><p id="login-error" class="error"></p></section>
    <section id="dashboard" hidden>
      <div class="toolbar"><div class="filters" id="views"><button class="active" data-view="orders">Orders</button><button data-view="customers">Customers</button></div><button id="refresh" class="secondary">Refresh</button></div>
      <div id="orders-view"><div class="toolbar"><div class="filters" id="filters"><button class="active" data-status="">All</button><button data-status="new">New</button><button data-status="processing">Processing</button><button data-status="shipped">Shipped</button><button data-status="delivered">Delivered</button><button data-status="cancelled">Cancelled</button></div></div><p id="status" class="muted"></p><div id="orders" class="orders"></div></div>
      <div id="customers-view" hidden><p id="customers-status" class="muted"></p><div id="customers" class="customers"></div></div>
    </section>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
